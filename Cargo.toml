[package]
name = "abnf"
description = "A nom-based parser for ABNF."
version = "0.13.0"
authors = ["Damian Poddebniak <poddebniak@fh-muenster.de>"]
readme = "README.md"
license = "MIT OR Apache-2.0"
edition = "2018"

repository = "https://github.com/duesee/abnf"
keywords = ["abnf", "parser", "nom"]

[features]
default = ["generate"]
generate = ["dep:arbitrary", "dep:getrandom", "dep:rand", "dep:rand_distr"]


[dependencies]
nom = "7"
abnf-core = "0.5"
arbitrary = { version = "1.5.0", optional = true, features = ["derive"] }
getrandom = { version = "0.4.3", optional = true }
rand = { version = "0.10", optional = true }
rand_distr = { version = "0.6", optional = true }

[dev-dependencies]
quickcheck        = "1"
quickcheck_macros = "1"
rand              = "0.10"
rand_distr        = "0.6"
